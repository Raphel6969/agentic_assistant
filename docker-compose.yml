services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_PLANNER_WS_URL=ws://planner:8000
      - NEXT_PUBLIC_PLANNER_URL=http://planner:8000
    depends_on:
      - planner
    networks:
      - agent_net

  planner:
    build:
      context: ./planner
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - GATEWAY_URL=http://gateway:8080
      - SOLVER_URL=http://solver:8090
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_started
      solver:
        condition: service_started
    networks:
      - agent_net

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    networks:
      - agent_net

  solver:
    build:
      context: ./solver
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    env_file:
      - .env
    networks:
      - agent_net

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agent_net

volumes:
  pgdata:

networks:
  agent_net:
    driver: bridge
